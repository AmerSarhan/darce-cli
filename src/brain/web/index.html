<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darce · brain</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8892b'/%3E%3Cpath d='M11 10l7 6-7 6' stroke='%2309090b' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f5f6; --surface: #ffffff; --sunk: #efeff1; --line: #e4e4e7; --line-2: #d4d4d8;
    --text: #18181b; --muted: #63636c; --faint: #a1a1aa;
    --accent: #e8892b; --accent-ink: #b45f0e; --accent-soft: #fdf0e3; --accent-line: #f3c99c;
    --read: #3f3f46; --read-soft: #ececef; --ok: #15803d; --bad: #c2410c; --bad-soft: #fef2f2;
    --add: #15803d; --add-soft: #ecfdf3; --del: #b91c1c; --del-soft: #fef2f2;
    --shadow: 0 1px 2px rgba(24, 24, 27, 0.05), 0 1px 1px rgba(24, 24, 27, 0.03);
    --shadow-lift: 0 8px 24px -8px rgba(24, 24, 27, 0.14), 0 1px 2px rgba(24, 24, 27, 0.06);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0f; --surface: #151518; --sunk: #1b1b1f; --line: #26262b; --line-2: #33333a;
      --text: #ececef; --muted: #9a9aa4; --faint: #5f5f69;
      --accent: #e8892b; --accent-ink: #f5a55a; --accent-soft: rgba(232, 137, 43, 0.13); --accent-line: rgba(232, 137, 43, 0.45);
      --read: #d4d4d8; --read-soft: #26262c; --ok: #4ade80; --bad: #fb923c; --bad-soft: rgba(248, 113, 113, 0.1);
      --add: #4ade80; --add-soft: rgba(74, 222, 128, 0.09); --del: #f87171; --del-soft: rgba(248, 113, 113, 0.09);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow-lift: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  .app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; }

  /* Header */
  header.top { display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .mark { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; flex: none; }
  .mark svg { width: 13px; height: 13px; }
  .project { font-weight: 600; letter-spacing: -0.01em; }
  .sep { width: 1px; height: 20px; background: var(--line); }
  .now { display: flex; align-items: center; gap: 9px; min-width: 0; color: var(--muted); }
  .now .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; transition: background .3s; }
  .now.busy .pulse { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .now.ask .pulse { background: var(--accent); }
  .now.ask { color: var(--accent-ink); font-weight: 500; }
  .now b { color: var(--text); font-weight: 500; }
  .now span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(232, 137, 43, .45); } 60% { box-shadow: 0 0 0 6px rgba(232, 137, 43, 0); } }
  .top .right { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--muted); white-space: nowrap; }
  .seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--sunk); }
  .seg button { height: 26px; padding: 0 11px; border-radius: 6px; color: var(--muted); font-weight: 500; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
  .toggle .sw { width: 26px; height: 15px; border-radius: 8px; background: var(--line-2); position: relative; transition: background .2s; }
  .toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .toggle[aria-pressed="true"] .sw { background: var(--accent); }
  .toggle[aria-pressed="true"] .sw::after { transform: translateX(11px); }
  .model { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }

  .main { display: grid; grid-template-columns: 280px minmax(0, 1fr) 360px; min-height: 0; }
  .pane { min-height: 0; display: flex; flex-direction: column; background: var(--surface); }
  .pane.left { border-right: 1px solid var(--line); }
  .pane.right { border-left: 1px solid var(--line); }
  .pane h2 { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); padding: 14px 14px 8px; display: flex; align-items: center; justify-content: space-between; }
  .pane h2 .count { font-weight: 400; color: var(--faint); font-variant-numeric: tabular-nums; }

  /* Files */
  .search { margin: 0 12px 8px; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 9px; border-radius: 8px; background: var(--sunk); color: var(--faint); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: inherit; }
  .search input::placeholder { color: var(--faint); }
  .legend { display: flex; gap: 12px; padding: 2px 14px 10px; color: var(--faint); font-size: 11.5px; border-bottom: 1px solid var(--line); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.read { background: var(--read); } .dot.changed { background: var(--accent); }
  .tree { flex: 1; overflow: auto; padding: 6px 6px 24px; }
  .row { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 6px; color: var(--muted); cursor: pointer; white-space: nowrap; position: relative; }
  .row:hover { background: var(--sunk); color: var(--text); }
  .row.sel { background: var(--accent-soft); color: var(--text); }
  .row .chev { width: 12px; color: var(--faint); transition: transform .15s; flex: none; }
  .row.open .chev { transform: rotate(90deg); }
  .row .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .row.dir .nm { color: var(--text); font-weight: 500; }
  .row.file.read .nm { color: var(--text); }
  .row.file.changed .nm { color: var(--accent-ink); font-weight: 500; }
  .row .tail { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; font-variant-numeric: tabular-nums; }
  .row .badge { color: var(--faint); }
  .row.flash-read { animation: flashRead 1.2s ease-out; }
  .row.flash-edit { animation: flashEdit 1.6s ease-out; }
  @keyframes flashRead { 0% { background: var(--read-soft); } 100% { background: transparent; } }
  @keyframes flashEdit { 0% { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); } 100% { background: transparent; box-shadow: inset 2px 0 0 transparent; } }

  /* Center */
  .center { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .stage { flex: 1; min-height: 0; position: relative; }
  .caption { padding: 16px 22px 0; color: var(--muted); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .caption h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.015em; color: var(--text); }

  /* Overview treemap */
  .treemap { position: absolute; inset: 14px 22px 22px; }
  .cell { position: absolute; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; cursor: pointer;
    transition: background .5s, border-color .5s, box-shadow .2s; }
  .cell:hover { border-color: var(--line-2); box-shadow: var(--shadow-lift); z-index: 2; }
  .cell .lb { position: absolute; left: 6px; top: 4px; right: 4px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .cell.read { background: var(--read-soft); border-color: var(--line-2); } .cell.read .lb { color: var(--text); }
  .cell.changed { background: var(--accent-soft); border-color: var(--accent-line); } .cell.changed .lb { color: var(--accent-ink); font-weight: 500; }
  .cell.now { box-shadow: 0 0 0 2px var(--accent); z-index: 3; }
  .cell.dim { opacity: .35; }
  .group { position: absolute; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); pointer-events: none; }
  .group .gl { position: absolute; left: 8px; top: 3px; right: 8px; font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Focus: what a file uses and what uses it */
  .focus { position: absolute; inset: 0; overflow: auto; }
  .bow { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 300px) minmax(0, 1fr); gap: 56px; padding: 22px 22px 8px; align-items: center; min-height: 300px; }
  .col { display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; z-index: 1; }
  .col h3 { margin: 0 0 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .col h3 small { font-weight: 400; color: var(--faint); }
  .col.uses { align-items: stretch; } .col.usedby { align-items: stretch; }
  .mini { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
    cursor: pointer; min-width: 0; transition: border-color .2s, transform .2s, background .4s, box-shadow .4s; animation: enter .35s cubic-bezier(.2, .8, .2, 1) both; }
  .mini:hover { border-color: var(--line-2); transform: translateY(-1px); }
  .mini .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .mini .dir { color: var(--faint); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: auto; padding-left: 8px; }
  .mini.affected { border-color: var(--accent-line); background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .more { color: var(--faint); font-size: 12px; padding: 2px 10px; }
  .empty-note { color: var(--faint); font-size: 12px; padding: 6px 10px; border: 1px dashed var(--line); border-radius: 8px; }
  .why { display: inline-block; margin-right: 6px; padding: 0 5px; border-radius: 4px; background: var(--accent); color: #0b0b0c; font: 600 10.5px/16px var(--sans); vertical-align: 1px; }
  @keyframes enter { from { opacity: 0; transform: translateY(4px); } }
  .card { position: relative; z-index: 1; padding: 16px 16px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow-lift);
    animation: enter .4s cubic-bezier(.2, .8, .2, 1) both; transition: border-color .4s, box-shadow .4s; }
  .card.changed { border-color: var(--accent-line); }
  .card.hit { animation: hit 1.1s ease-out; }
  @keyframes hit { 0% { box-shadow: 0 0 0 0 rgba(232, 137, 43, .55), var(--shadow-lift); } 100% { box-shadow: 0 0 0 14px rgba(232, 137, 43, 0), var(--shadow-lift); } }
  .card .path { font-family: var(--mono); font-size: 11.5px; color: var(--faint); overflow-wrap: anywhere; }
  .card .title { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; margin: 2px 0 8px; overflow-wrap: anywhere; }
  .card .facts { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .pill.changed { background: var(--accent-soft); color: var(--accent-ink); }
  .pill.read { background: var(--read-soft); color: var(--text); }
  .card .say { margin: 10px 0 0; color: var(--muted); font-size: 12.5px; }
  .links { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .links path { fill: none; stroke: var(--line-2); stroke-width: 1.4; }
  .links path.hot { stroke: var(--accent); stroke-width: 1.6; }
  .links path.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .6s cubic-bezier(.4, 0, .2, 1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .code { margin: 8px 22px 22px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
  .code .bar { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .code .bar b { color: var(--text); font-weight: 500; }
  .code .body { max-height: 420px; overflow: auto; font: 12px/1.65 var(--mono); padding: 6px 0; }
  .ln { display: grid; grid-template-columns: 48px 1fr; white-space: pre; padding-right: 14px; }
  .ln .n { color: var(--faint); text-align: right; padding-right: 14px; user-select: none; }
  .ln.a { background: var(--add-soft); } .ln.a .c { color: var(--add); }
  .ln.d { background: var(--del-soft); } .ln.d .c { color: var(--del); }
  .gap { color: var(--faint); padding: 2px 14px; font: 12px var(--mono); }
  .empty-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 40px; }
  .empty-center h3 { margin: 0 0 6px; font-size: 15px; color: var(--text); font-weight: 600; }

  /* Activity */
  .feed { flex: 1; overflow: auto; padding: 4px 12px 28px; }
  .turn { margin-top: 12px; }
  .ask-you { padding: 10px 12px; border-radius: 10px; background: var(--sunk); color: var(--text); font-size: 13px; overflow-wrap: anywhere; }
  .ask-you .who { display: block; font-size: 11px; color: var(--faint); margin-bottom: 2px; }
  .steps { list-style: none; margin: 8px 0 0; padding: 0; counter-reset: s; }
  .step { display: grid; grid-template-columns: 22px 16px minmax(0, 1fr) auto; align-items: start; gap: 8px; padding: 6px 6px; border-radius: 8px; color: var(--muted); animation: enter .3s ease-out both; }
  .step::before { counter-increment: s; content: counter(s); font-size: 11px; color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; line-height: 19px; }
  .step.link { cursor: pointer; } .step.link:hover { background: var(--sunk); color: var(--text); }
  .step .i { margin-top: 2px; color: var(--faint); }
  .step.read .i { color: var(--read); } .step.edit .i { color: var(--accent); } .step.fail .i { color: var(--bad); }
  .step .tx { min-width: 0; overflow-wrap: anywhere; }
  .step .tx code { color: var(--text); }
  .step .meta { font-size: 11.5px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 19px; }
  .step.running .meta::after { content: ""; display: inline-block; width: 10px; height: 10px; margin-left: 4px; border-radius: 50%; border: 1.5px solid var(--line-2); border-top-color: var(--accent); animation: spin .8s linear infinite; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .add { color: var(--add); } .del { color: var(--del); }
  .reply { margin: 8px 0 0 30px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; max-height: 220px; overflow: hidden; position: relative; }
  .reply.long::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: linear-gradient(transparent, var(--surface)); }
  .reply .who { display: block; font-size: 11px; color: var(--faint); margin-bottom: 1px; }
  .note { margin: 6px 0 0 30px; font-size: 12px; color: var(--muted); display: flex; gap: 7px; align-items: flex-start; }
  .note.voice { font-style: italic; }
  .note.wait { color: var(--accent-ink); font-weight: 500; font-style: normal; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); margin-left: 0; }
  .note.err { color: var(--bad); }
  .done { margin: 8px 0 0 30px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .feed .empty { color: var(--muted); padding: 22px 6px; line-height: 1.7; }
  .feed .empty b { color: var(--text); font-weight: 600; display: block; margin-bottom: 2px; }

  #tip { position: fixed; z-index: 20; pointer-events: none; padding: 7px 10px; border-radius: 8px; background: var(--text); color: var(--surface); font-size: 12px; max-width: 320px;
    opacity: 0; transform: translateY(3px); transition: opacity .12s, transform .12s; }
  #tip.on { opacity: 1; transform: none; }
  #tip .s { opacity: .7; }
  .banner { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); padding: 7px 12px; border-radius: 8px; background: var(--text); color: var(--surface); font-size: 12px; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .banner.on { opacity: 1; }

  @media (max-width: 1100px) { .main { grid-template-columns: 0 minmax(0, 1fr) 320px; } .pane.left { display: none; } }
  @media (max-width: 760px) { .main { grid-template-columns: 1fr; grid-template-rows: 1fr 40vh; } .pane.right { border-left: 0; border-top: 1px solid var(--line); } .top .right .model, .top .right .toggle { display: none; } .bow { grid-template-columns: 1fr; gap: 14px; } .links { display: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M5 4l5 4-5 4" stroke="#09090b" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <span class="project" id="project">Project</span>
    <span class="sep"></span>
    <div class="now" id="now"><i class="pulse"></i><span id="now-text">Connecting to Darce…</span></div>
    <div class="right">
      <span class="model" id="model"></span>
      <button class="toggle" id="follow" aria-pressed="true" title="Jump to each file Darce works on"><span class="sw"></span>Follow Darce</button>
      <div class="seg" role="group" aria-label="View">
        <button id="v-focus" aria-pressed="true">Focus</button>
        <button id="v-map" aria-pressed="false">Map</button>
      </div>
    </div>
  </header>

  <div class="main">
    <aside class="pane left" aria-label="Files">
      <h2>Files <span class="count" id="file-count"></span></h2>
      <label class="search"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="find" placeholder="Find a file" autocomplete="off" spellcheck="false"></label>
      <div class="legend"><span><i class="dot read"></i>Darce read it</span><span><i class="dot changed"></i>Darce changed it</span></div>
      <div class="tree" id="tree" role="tree"></div>
    </aside>

    <main class="center">
      <div class="stage" id="stage"></div>
    </main>

    <aside class="pane right" aria-label="What Darce is doing">
      <h2>Activity <span class="count" id="step-count"></span></h2>
      <div class="feed" id="feed">
        <div class="empty" id="feed-empty"><b>Waiting for your first message</b>Ask Darce something in your terminal. Each step it takes shows up here, and the file it's working on opens in the middle.</div>
      </div>
    </aside>
  </div>
</div>
<div id="tip"></div>
<div class="banner" id="banner"></div>
<script src="app.js"></script>
</body>
</html>
